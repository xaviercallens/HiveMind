name: HiveMind Immutable Release & Attestation Pipeline

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  immutable-release-build:
    name: "Build, Verify & Attest Immutable Release Bundle"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Project HiveMind Tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.11 & Dependencies
        run: |
          uv python install 3.11
          uv venv
          uv pip install pytest httpx fastapi uvicorn pydantic pyyaml rich numpy torch transformers peft accelerate safetensors datasets huggingface-hub

      - name: Pre-Release Gate — Full 20/20 Test Suite & Lean 4 Audit
        env:
          CUBLAS_WORKSPACE_CONFIG: ":4096:8"
          PYTHONHASHSEED: "42"
        run: |
          uv run --no-sync pytest tests/ -v --tb=short

      - name: Package Steam Edition & Generate Cryptographic SHA-256 Checksums
        run: |
          zip -r HiveMind_Steam_FreeEdition_${{ github.ref_name }}.zip steam_dist/HiveMind_Steam_FreeEdition/ docs/STEAM_STATUS.md
          sha256sum HiveMind_Steam_FreeEdition_${{ github.ref_name }}.zip \
            paper/hivemind_foundation_article.pdf \
            lean4/HiveMindSpec.lean \
            artifacts/rtx_intense_stress_and_steam_deploy_report.json \
            artifacts/hf_hack_miner_game_report.json \
            steam_dist/HiveMind_Steam_FreeEdition/rtx_gpu_deployment_cert.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
