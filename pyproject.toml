[project]
name = "project-hivemind"
version = "2.2.0"
description = "Project HiveMind: Decentralized MoE Training & Inference via Steam, BOINC, and DiLoCo-QLoRA"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4.0,<2.15.0",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "bitsandbytes>=0.43.3",
    "accelerate>=0.33.0",
    "safetensors>=0.4.4",
    "pyarrow>=17.0.0",
    "fastapi>=0.112.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.2",
    "psutil>=6.0.0",
    "rich>=13.7.0",
    "numpy>=1.26.0,<2.5.0",
    "aioquic>=1.2.0",
    "websockets>=13.0",
    "cryptography>=42.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
astro = [
    "pillow>=10.0.0",
]
dev = [
    "pillow>=10.0.0",
    "hypothesis>=6.100.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "coverage>=7.6.0",
    "pytest-cov>=5.0.0",
    "openai>=1.0.0",
]

[project.scripts]
hivemind = "hivemind.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hivemind"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/hivemind"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
