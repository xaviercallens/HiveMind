name: Web Portal & Auth Intense Tests

# Intensive tests of the web portal and the gateway's account code. The required CI job already runs the same test files with
# small deterministic Hypothesis profiles; this workflow runs them at scale, in a real browser, and through a static scan.
on:
  pull_request:
    branches: [main]
    paths:
      - "src/hivemind/web_v32/**"
      - "src/hivemind/router/accounts.py"
      - "src/hivemind/router/gateway.py"
      - "src/hivemind/router/forwarded_client.py"
      - "src/hivemind/router/password_reset_email.py"
      - "src/hivemind/boinc/hivemind_at_home_dashboard.py"
      - "tests/test_web_v3*.py"
      - "tests/test_auth_v3*.py"
      - "tests/test_gateway_password_check_scope.py"
      - ".github/workflows/web_auth_intense.yml"
  push:
    branches: [main]
    paths:
      - "src/hivemind/web_v32/**"
      - "src/hivemind/router/accounts.py"
      - "src/hivemind/router/gateway.py"
  schedule:
    - cron: "17 2 * * *"  # nightly, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: "src:."
  PYTHONHASHSEED: "42"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  property-and-fuzz:
    name: "Auth property tests and web fuzzing (Hypothesis, intense profile)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HYPOTHESIS_PROFILE: hivemind-intense
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install dependencies (CPU)
        run: |
          uv venv
          uv pip install --no-sources --torch-backend cpu -e ".[dev]" datasets huggingface-hub aioquic websockets cryptography \
            "torch==2.6.0" "transformers==4.57.6" "peft==0.17.1" "numpy==2.1.3"
      - name: Password-check properties (any stored format, wrong passwords never match, failures change nothing)
        run: uv run --no-sync python -m pytest -q tests/test_auth_v33_password_properties.py
      - name: Web portal fuzzing, CSRF matrix, header invariants, cookie tampering, redirects
        run: uv run --no-sync python -m pytest -q tests/test_web_v33_intense.py tests/test_web_v33_i18n.py
      - name: Portal and gateway regression suites
        run: |
          uv run --no-sync python -m pytest -q tests/test_web_v32.py tests/test_web_v32_paths.py tests/test_web_v32_end_to_end.py \
            tests/test_auth_v32_gateway.py tests/test_gateway_password_check_scope.py tests/test_signup_and_credentials_auth.py \
            tests/test_dashboard_account_ownership.py tests/test_router_accounts.py tests/test_router_gateway_security.py

  browser:
    name: "Portal in Chromium (Playwright) with axe-core accessibility scan"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Install the portal's dependencies, Playwright and Chromium
        run: |
          uv venv
          uv pip install "fastapi==0.115.6" "uvicorn[standard]==0.32.1" "pydantic==2.9.2" "httpx==0.27.2" cryptography pytest "playwright==1.48.0"
          uv run --no-sync python -m playwright install --with-deps chromium
      - name: Install axe-core
        run: npm install --no-save --prefix "$RUNNER_TEMP/axe" axe-core@4.10.2
      - name: Browser end-to-end test
        env:
          AXE_JS: ${{ runner.temp }}/axe/node_modules/axe-core/axe.min.js
        # --noconftest: the shared conftest imports the GPU stack, which this light job does not install
        run: uv run --no-sync python -m pytest -q --noconftest tests/test_web_v33_browser.py

  static-security:
    name: "Static security scan of the portal and auth modules (Bandit, medium and above)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Bandit
        run: |
          uv venv
          uv pip install "bandit==1.7.10"
          uv run --no-sync bandit -q -ll -r src/hivemind/web_v32 src/hivemind/router/forwarded_client.py src/hivemind/router/password_reset_email.py
