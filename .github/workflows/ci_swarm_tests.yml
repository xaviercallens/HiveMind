name: HiveMind Swarm CI & Verification Suite

on:
  push:
    branches: [main, "feat/**", "expert/**", "game/**", "fix/**", "docs/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-swarm-suite:
    name: "Verify 4 Core Pillars, Swarm Fabric (M1-M5), Lean 4 Spec & Steam Hack-Miner"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PYTHONPATH: "src:."
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      PYTHONHASHSEED: "42"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"

    steps:
      - name: Checkout Project HiveMind
        uses: actions/checkout@v7

      - name: Install uv (Fast Python Package Manager)
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install Dependencies (CPU CI Fallback + FastAPI/PyTorch/Transformers/PEFT + Coverage)
        run: |
          uv venv
          uv pip install --no-sources --torch-backend cpu -e ".[dev]" datasets huggingface-hub aioquic websockets cryptography coverage pytest-cov \
            "torch==2.6.0" "transformers==4.57.6" "peft==0.17.1" "numpy==2.1.3"
          uv pip check
          uv run --no-sync python -c "import torch, transformers, peft, coverage"

      - name: Compile Lean specification with pinned lean4/lean-toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: lean4
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"

      - name: Require compiler-checked proofs (162+ Theorems) and complete axiom audit
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          from paper.autoevolve_peer_review_pipeline import require_machine_checked, verify_lean4_specification
          result = verify_lean4_specification()
          print("Lean audit:", result)
          require_machine_checked(result)
          assert result["theorem_count"] >= 162, f"Expected at least 162 theorems, got {result['theorem_count']}"
          assert result["rda_multiplier_audit"]["verified"] is True, f"RDAMultiplier Lean receipt check failed: {result['rda_multiplier_audit']}"
          Path("artifacts").mkdir(parents=True, exist_ok=True)
          Path("artifacts/lean4_formal_verification_audit.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          PY

      - name: Run Unit & Integration Verification Suite with >=95% Coverage Gate
        run: |
          uv run --no-sync python -m coverage run --source=src/hivemind -m pytest tests/ -v --tb=short
          uv run --no-sync python -m coverage report --fail-under=95 --show-missing
          uv run --no-sync python -m coverage xml -o artifacts/coverage.xml
          uv run --no-sync python -m coverage json -o artifacts/coverage.json

      - name: Publish CI Coverage & Formal Proof Summary to GitHub Step Summary
        run: |
          uv run --no-sync python - <<'PY'
          import json, os
          from pathlib import Path
          cov = json.loads(Path("artifacts/coverage.json").read_text(encoding="utf-8"))
          lean_path = Path("artifacts/lean4_formal_verification_audit.json")
          lean_n = int(json.loads(lean_path.read_text(encoding="utf-8")).get("theorem_count", 162)) if lean_path.exists() else 162
          pct = cov["totals"]["percent_covered"]
          stmts = cov["totals"]["num_statements"]
          covered = cov["totals"]["covered_lines"]
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write(f"## 🛡️ Project HiveMind CI Quality & Coverage Gate (`{pct:.2f}%` >= `95.00%`)\n\n")
                  f.write(f"- **Total Statements Covered:** `{covered} / {stmts}` (**`{pct:.2f}%`**)\n")
                  f.write(f"- **Formal Lean 4 Specification:** `{lean_n}` Theorems Machine-Checked (`0 sorry`, `0` user axioms, `RDAMultiplier` receipt verified)\n")
          PY

      - name: Upload Coverage XML & JSON Reports
        uses: actions/upload-artifact@v4
        with:
          name: hivemind-coverage-report
          path: |
            artifacts/coverage.xml
            artifacts/coverage.json

      - name: Verify CLI Entrypoints & Hardware Telemetry
        run: |
          uv run --no-sync python -m hivemind.cli.main --help
          uv run --no-sync python -m hivemind.cli.main hardware-check
          uv run --no-sync python -m hivemind.cli.main scan-pr-security --root . --output-json artifacts/ci_security_audit.json
          uv run --no-sync python -m hivemind.cli.main audit-swarm-hardening --output-json artifacts/swarm_gpu_and_datastore_hardening_report.json
