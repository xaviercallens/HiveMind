name: HiveMind Immutable Release & Attestation Pipeline

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  immutable-release-build:
    name: "Build, Verify & Attest Immutable Release Bundle"
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PYTHONPATH: "src:."
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
      PYTHONHASHSEED: "42"

    steps:
      - name: Checkout Project HiveMind Tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python 3.11 & Dependencies
        run: |
          uv python install 3.11
          uv venv
          uv pip install --no-sources --torch-backend cpu -e ".[dev]" datasets huggingface-hub aioquic websockets cryptography coverage pytest-cov \
            "torch==2.6.0" "transformers==4.57.6" "peft==0.17.1" "numpy==2.1.3"
          uv pip check
          uv run --no-sync python -c "import torch, transformers, peft, coverage"

      - name: Compile Lean specification with pinned lean4/lean-toolchain
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1
        with:
          lake-package-directory: lean4
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"

      - name: Require compiler-checked proofs (48+ Theorems) and complete axiom audit
        run: |
          uv run --no-sync python - <<'PY'
          from paper.autoevolve_peer_review_pipeline import require_machine_checked, verify_lean4_specification
          result = verify_lean4_specification()
          print("Lean audit:", result)
          require_machine_checked(result)
          assert result["theorem_count"] >= 48, f"Expected at least 48 theorems, got {result['theorem_count']}"
          PY

      - name: Pre-Release Gate — Full Test Suite & >=95% Coverage Enforcement
        run: |
          uv run --no-sync python -m coverage run --source=src/hivemind -m pytest tests/ -v --tb=short
          uv run --no-sync python -m coverage report --fail-under=95 --show-missing

      - name: Package Steam Edition & Generate Cryptographic SHA-256 Checksums
        env:
          REF_NAME: ${{ github.ref_name }}  # passed as data, never spliced into the shell text
        run: |
          zip -r "HiveMind_Steam_FreeEdition_${REF_NAME}.zip" steam_dist/HiveMind_Steam_FreeEdition/ docs/STEAM_STATUS.md
          sha256sum "HiveMind_Steam_FreeEdition_${REF_NAME}.zip" \
            paper/hivemind_foundation_article.pdf \
            lean4/HiveMindSpec.lean \
            artifacts/rtx_intense_stress_and_steam_deploy_report.json \
            artifacts/hf_hack_miner_game_report.json \
            artifacts/swarm_strategy_improvement_report.json \
            artifacts/wan_quic_turn_fault_report.json \
            steam_dist/HiveMind_Steam_FreeEdition/rtx_gpu_deployment_cert.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
